// android/vpnplugin/build.gradle
plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.example.fluttervpngo.vpnplugin'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    // Required so libclient.so (ELF binary) is extracted from APK to nativeLibraryDir
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // ── WireGuard Android (GoBackend — same lib as official WG for Android) ──
    implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // ── AndroidX ─────────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.annotation:annotation:1.7.1'

    // ── Kotlin coroutines ─────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── Flutter embedding (provided by host app) ──────────────────────────────
    compileOnly 'io.flutter:flutter_embedding_debug:1.0.0'

    // ── Go client via gomobile AAR (iOS XCFramework built separately) ─────────
    // NOTE: Android now uses libclient.so (ProcessBuilder) instead of gomobile AAR.
    // The AAR is kept as optional fallback if the ELF binary is not present.
    // To use gomobile path: uncomment and build with build_android.sh
    // implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}
