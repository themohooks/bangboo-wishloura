# ─────────────────────────────────────────────────────────────────────────────
# release.yml
#
# Triggered by:
#   • Pushing a semver tag:  git tag v1.2.3 && git push origin v1.2.3
#   • Manual dispatch from GitHub Actions UI (workflow_dispatch)
#
# Steps:
#   1. [parallel] build-android  — ubuntu-latest
#       a. Build Go libclient.so (arm64, armeabi-v7a, x86_64) via CGO
#       b. flutter build apk --split-per-abi
#       c. flutter build apk (universal)
#       d. flutter build appbundle (AAB)
#   2. [parallel] build-ios      — macos-14
#       a. gomobile bind → GoClient.xcframework
#       b. flutter build ios
#       c. xcodebuild archive + export IPA
#   3. [sequential] create-release — ubuntu-latest
#       a. Download all artifacts
#       b. Generate combined SHA256SUMS
#       c. Generate release notes (git log since last tag)
#       d. gh release create with all files
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"       # v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"     # v1.2.3-beta.1

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3). Creates it if absent."
        required: true
        default: "v0.0.0-dev"
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: true
      build-type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release
      skip-ios:
        description: "Skip iOS build (saves ~20 min on macOS runner)"
        type: boolean
        default: false

# Prevent concurrent releases of the same ref
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create release + upload assets
  actions: read

jobs:
  # ── Resolve inputs ──────────────────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.vars.outputs.tag }}
      version:    ${{ steps.vars.outputs.version }}
      build-type: ${{ steps.vars.outputs.build-type }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      skip-ios:   ${{ steps.vars.outputs.skip-ios }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            BUILD_TYPE="${{ github.event.inputs.build-type }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            SKIP_IOS="${{ github.event.inputs.skip-ios }}"
          else
            TAG="${{ github.ref_name }}"
            # Auto-detect prerelease from tag suffix (e.g. v1.0.0-beta.1)
            if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              PRERELEASE="false"
            else
              PRERELEASE="true"
            fi
            BUILD_TYPE="release"
            SKIP_IOS="false"
          fi

          # Strip leading 'v' for flutter version string
          VERSION="${TAG#v}"

          echo "tag=$TAG"           >> $GITHUB_OUTPUT
          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "build-type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "skip-ios=$SKIP_IOS"   >> $GITHUB_OUTPUT

          echo "📦 Tag: $TAG | Version: $VERSION | Type: $BUILD_TYPE | Pre: $PRERELEASE"

      - name: Create tag (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping creation"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "✅ Created and pushed tag $TAG"
          fi

  # ── Android build ────────────────────────────────────────────────────────────
  build-android:
    name: Build Android
    needs: setup
    uses: ./.github/workflows/_build-android.yml
    with:
      flutter-version: "3.22.x"
      go-version:      "1.22.x"
      build-type:      ${{ needs.setup.outputs.build-type }}
      upload-artifacts: true
    secrets:
      KEYSTORE_BASE64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS:          ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD:       ${{ secrets.ANDROID_KEY_PASSWORD }}

  # ── iOS build ─────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    needs: setup
    if: ${{ needs.setup.outputs.skip-ios == 'false' }}
    uses: ./.github/workflows/_build-ios.yml
    with:
      flutter-version: "3.22.x"
      go-version:      "1.22.x"
      build-type:      ${{ needs.setup.outputs.build-type }}
      upload-artifacts: true
    secrets:
      IOS_CERTIFICATE_BASE64:          ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD:        ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID:                     ${{ secrets.IOS_TEAM_ID }}
      KEYCHAIN_PASSWORD:               ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

  # ── Create GitHub Release ─────────────────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [setup, build-android, build-ios]
    # Run even if iOS was skipped (but not if Android failed)
    if: >
      always() &&
      needs.build-android.result == 'success' &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Download Android artifacts ──────────────────────────────────────────
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.setup.outputs.build-type }}
          path: release-assets/android/

      # ── Download iOS artifacts ──────────────────────────────────────────────
      - name: Download iOS artifacts
        if: ${{ needs.build-ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ needs.setup.outputs.build-type }}
          path: release-assets/ios/

      # ── Combine all files ───────────────────────────────────────────────────
      - name: Collect all release assets
        run: |
          mkdir -p release-final
          find release-assets/ -type f | while read f; do
            cp "$f" release-final/
          done
          echo "📦 All release assets:"
          ls -lh release-final/

      # ── Combined checksums ──────────────────────────────────────────────────
      - name: Generate combined checksums
        working-directory: release-final
        run: |
          # Remove per-platform checksum files, generate one combined file
          rm -f SHA256SUMS-android.txt SHA256SUMS-ios.txt
          sha256sum * > SHA256SUMS.txt
          echo ""
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      # ── Generate release notes ─────────────────────────────────────────────
      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          VERSION="${{ needs.setup.outputs.version }}"
          BUILD_TYPE="${{ needs.setup.outputs.build-type }}"

          # Previous tag for changelog range
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" 2>/dev/null || echo "")
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --max-count=20 || echo "")
          fi

          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          SHORT_SHA=$(git rev-parse --short HEAD)

          # List available assets
          ASSET_LIST=$(ls release-final/ | grep -v SHA256SUMS | while read f; do echo "- \`$f\`"; done)

          cat > release-notes.md << EOF
          ## flutter_vpn_go $VERSION

          **Build:** \`$BUILD_TYPE\` | **Date:** $BUILD_DATE | **Commit:** \`$SHORT_SHA\`

          ---

          ### 📦 Downloads

          $ASSET_LIST

          > **Checksums:** See \`SHA256SUMS.txt\` attached to this release.

          ---

          ### 📋 What's included

          | File | Description |
          |---|---|
          | \`*-arm64-v8a.apk\` | Android APK — modern devices (ARM64) |
          | \`*-armeabi-v7a.apk\` | Android APK — older devices (ARMv7) |
          | \`*-x86_64.apk\` | Android APK — emulators (x86_64) |
          | \`*-universal.apk\` | Android APK — all ABIs (larger, works on any device) |
          | \`*.aab\` | Android App Bundle — for Google Play upload |
          | \`*.ipa\` | iOS IPA — sideload via AltStore / Sideloadly |
          | \`SHA256SUMS.txt\` | SHA256 checksums for all files |

          ---

          ### 🔧 Setup

          #### Android
          1. Download the APK for your device ABI (or the universal APK).
          2. Enable "Install from unknown sources" in Android Settings.
          3. Install the APK.
          4. On first launch, allow the VPN permission when prompted.

          #### iOS
          1. Download the \`.ipa\` file.
          2. Use [AltStore](https://altstore.io/) or [Sideloadly](https://sideloadly.io/) to install.
          3. Trust the developer certificate in Settings → General → VPN & Device Management.
          4. ⚠️ **iOS Simulator is not supported for VPN functionality** — real device required.

          ---

          ### ⚙️ Configuration

          Import your server config via the **Import** tab using this JSON format:

          \`\`\`json
          {
            "name": "My Server",
            "serverHost": "your-server.example.com",
            "serverPort": 443,
            "transportType": "mock",
            "authToken": "your-token",
            "mtu": 1280
          }
          \`\`\`

          ---

          ### 📝 Changelog

          ${CHANGELOG:-*No previous tag found — this may be the first release.*}

          ---

          ### ⚠️ Security Notes

          - Auth tokens are stored in the system Keychain (iOS) / EncryptedSharedPreferences (Android).
          - Never share your config JSON with sensitive \`authToken\` fields.
          - This app connects **only** to the server you configure — no third-party relays.

          EOF

          echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT
          cat release-notes.md

      # ── Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.setup.outputs.tag }}
          name:       "flutter_vpn_go ${{ needs.setup.outputs.tag }}"
          body_path:  release-notes.md
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          draft:      false
          files:      release-final/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Release summary ────────────────────────────────────────────────────
      - name: Summary
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          echo "## 🚀 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://github.com/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls release-final/ | while read f; do
            echo "- \`$f\` ($(du -sh release-final/$f | cut -f1))" >> $GITHUB_STEP_SUMMARY
          done
