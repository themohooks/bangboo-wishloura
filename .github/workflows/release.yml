# ─────────────────────────────────────────────────────────────────────────────
# release.yml
#
# Triggered by:
#   git tag v1.2.3 && git push origin v1.2.3
#   OR: Actions → Release → Run workflow
#
# The repository root IS the flutter project (pubspec.yaml at root).
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        default: "v0.0.1-dev"
      prerelease:
        description: "Mark as pre-release?"
        type: boolean
        default: true
      build-type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release
      skip-ios:
        description: "Skip iOS build (saves ~20 min)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  # ── Resolve tag / version ────────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.vars.outputs.tag }}
      version:    ${{ steps.vars.outputs.version }}
      build-type: ${{ steps.vars.outputs.build-type }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      skip-ios:   ${{ steps.vars.outputs.skip-ios }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            BT="${{ github.event.inputs.build-type }}"
            PRE="${{ github.event.inputs.prerelease }}"
            SKIP="${{ github.event.inputs.skip-ios }}"
          else
            TAG="${{ github.ref_name }}"
            BT="release"
            SKIP="false"
            # Auto-detect prerelease: pure semver = stable, anything else = pre
            echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              && PRE="false" || PRE="true"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"        >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build-type=$BT"  >> $GITHUB_OUTPUT
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "skip-ios=$SKIP"  >> $GITHUB_OUTPUT
          echo "📦 $TAG | $VERSION | $BT | pre=$PRE"

      - name: Create tag (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" && git push origin "$TAG"
            echo "✅ Created tag $TAG"
          fi

  # ── Android ──────────────────────────────────────────────────────────────
  build-android:
    name: Build Android
    needs: setup
    uses: ./.github/workflows/_build-android.yml
    with:
      flutter-version:  "3.22.x"
      go-version:       "1.22.x"
      build-type:       ${{ needs.setup.outputs.build-type }}
      upload-artifacts: true
    secrets:
      KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}

  # ── iOS ───────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    needs: setup
    if: ${{ needs.setup.outputs.skip-ios == 'false' }}
    uses: ./.github/workflows/_build-ios.yml
    with:
      flutter-version:  "3.22.x"
      go-version:       "1.22.x"
      build-type:       ${{ needs.setup.outputs.build-type }}
      upload-artifacts: true
    secrets:
      IOS_CERTIFICATE_BASE64:           ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD:         ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64:  ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID:                      ${{ secrets.IOS_TEAM_ID }}
      KEYCHAIN_PASSWORD:                ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

  # ── Create Release ────────────────────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [setup, build-android, build-ios]
    if: >-
      always() &&
      needs.build-android.result == 'success' &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.setup.outputs.build-type }}
          path: release-assets/

      - name: Download iOS artifacts
        if: ${{ needs.build-ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ needs.setup.outputs.build-type }}
          path: release-assets/

      - name: Flatten artifact paths
        run: |
          mkdir -p release-final
          find release-assets/ -type f -exec cp {} release-final/ \;
          echo "=== All release assets ==="
          ls -lh release-final/

      - name: Generate combined checksums
        working-directory: release-final
        run: |
          rm -f SHA256SUMS-android.txt SHA256SUMS-ios.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          VERSION="${{ needs.setup.outputs.version }}"
          BT="${{ needs.setup.outputs.build-type }}"
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          SHA=$(git rev-parse --short HEAD)

          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV}..${TAG}" 2>/dev/null)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --max-count=20)
          fi

          ASSETS=$(ls release-final/ | grep -v SHA256SUMS | sed 's/^/- `/' | sed 's/$/`/')

          cat > notes.md << EOF
          ## flutter_vpn_go $VERSION

          **Build:** \`$BT\` | **Date:** $DATE | **Commit:** \`$SHA\`

          ---

          ### 📦 Downloads

          $ASSETS

          > **Checksums:** \`SHA256SUMS.txt\` is attached to this release.

          ---

          ### 📱 Install

          | File | Platform | Notes |
          |------|----------|-------|
          | \`*-arm64-v8a.apk\` | Android | Modern devices (recommended) |
          | \`*-armeabi-v7a.apk\` | Android | Older devices |
          | \`*-x86_64.apk\` | Android | Emulator |
          | \`*-universal.apk\` | Android | All architectures |
          | \`*.aab\` | Android | Google Play upload |
          | \`*.ipa\` | iOS | AltStore / Sideloadly |

          **Android:** Enable "Install from unknown sources" → install APK → allow VPN.

          **iOS:** Install via [AltStore](https://altstore.io/) or [Sideloadly](https://sideloadly.io/) → trust cert.

          > ⚠️ iOS Simulator is **not supported** — VPN requires a physical device.

          ---

          ### 📝 Changes

          ${LOG:-*First release.*}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ needs.setup.outputs.tag }}
          name:       "flutter_vpn_go ${{ needs.setup.outputs.tag }}"
          body_path:  notes.md
          prerelease: ${{ needs.setup.outputs.prerelease == 'true' }}
          draft:      false
          files:      release-final/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          TAG="${{ needs.setup.outputs.tag }}"
          {
            echo "## 🚀 Release: $TAG"
            echo ""
            echo "**URL:** https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo ""
            echo "### Assets"
            ls release-final/ | while read f; do
              echo "- \`$f\` — $(du -sh release-final/$f | cut -f1)"
            done
          } >> $GITHUB_STEP_SUMMARY
