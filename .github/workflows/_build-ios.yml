# Reusable workflow: build iOS IPA + Go XCFramework
# The repository root IS the flutter project (pubspec.yaml is at repo root).

name: Build iOS

on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        default: "3.22.x"
      go-version:
        type: string
        default: "1.22.x"
      build-type:
        type: string
        default: "release"
      upload-artifacts:
        type: boolean
        default: true
      xcode-version:
        type: string
        default: ""
    secrets:
      IOS_CERTIFICATE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      IOS_TEAM_ID:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
    outputs:
      ipa:
        value: ${{ jobs.build.outputs.ipa }}

jobs:
  build:
    name: iOS (${{ inputs.build-type }})
    runs-on: macos-14

    outputs:
      ipa: ${{ steps.collect.outputs.ipa }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Xcode ─────────────────────────────────────────────────────────────
      - name: Select Xcode
        if: ${{ inputs.xcode-version != '' }}
        run: sudo xcode-select -s /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      # ── Go ────────────────────────────────────────────────────────────────
      - name: Set up Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: go_client/go.sum

      # ── Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter ${{ inputs.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true

      # ── gomobile ──────────────────────────────────────────────────────────
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      # ── Go mod tidy ───────────────────────────────────────────────────────
      - name: Go mod tidy
        working-directory: go_client
        run: go mod tidy

      # ── Build GoClient.xcframework ────────────────────────────────────────
      - name: Build GoClient.xcframework
        working-directory: go_client
        run: |
          rm -rf ../ios/Frameworks/GoClient.xcframework
          mkdir -p ../ios/Frameworks
          gomobile bind \
            -target=ios \
            -o ../ios/Frameworks/GoClient.xcframework \
            ./client
          echo "✅ XCFramework: $(du -sh ../ios/Frameworks/GoClient.xcframework | cut -f1)"

      # ── Flutter pub get ───────────────────────────────────────────────────
      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Flutter pub get
        run: flutter pub get

      # ── iOS signing ───────────────────────────────────────────────────────
      # NOTE: 'secrets' context cannot be used in 'if:' of reusable workflows.
      # All secret checks happen inside 'run:' via env vars.
      - name: Set up iOS signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PP_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ "${{ inputs.build-type }}" != "release" ] || \
             [ -z "$CERT_B64" ] || [ -z "$PP_B64" ]; then
            echo "⚠️  No signing secrets — will build unsigned"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          KPASS="${KC_PASS:-random-$(date +%s)}"
          security create-keychain -p "$KPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPASS" "$KC"

          CERT="$RUNNER_TEMP/cert.p12"
          echo "$CERT_B64" | base64 --decode -o "$CERT"
          security import "$CERT" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"

          PP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PP_B64" | base64 --decode -o "$PP"
          UUID=$(security cms -D -i "$PP" | \
                 plutil -extract UUID xml1 - -o - | \
                 sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          # Signal that signing is ready
          echo "IOS_SIGNING_READY=true" >> $GITHUB_ENV
          echo "✅ Signing profile: $UUID"

      # ── Flutter build iOS ─────────────────────────────────────────────────
      - name: Flutter build iOS
        env:
          IOS_CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          BT="${{ inputs.build-type }}"
          if [ "$BT" = "release" ] && [ -n "$IOS_CERT_B64" ] && \
             [ "${IOS_SIGNING_READY:-false}" = "true" ]; then
            flutter build ios --release \
              --obfuscate --split-debug-info=build/debug-info
          else
            flutter build ios --"$BT" --no-codesign
          fi

      # ── Archive ───────────────────────────────────────────────────────────
      - name: xcodebuild archive
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          VERSION=$(grep '^version:' ../pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          BUILD_NUM=$(echo "$VERSION" | cut -d'+' -f2)
          APP_VER=$(echo "$VERSION"  | cut -d'+' -f1)

          ARCHIVE="$RUNNER_TEMP/Runner.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE" >> $GITHUB_ENV

          if [ "${{ inputs.build-type }}" = "release" ] && \
             [ -n "$IOS_TEAM_ID" ] && \
             [ "${IOS_SIGNING_READY:-false}" = "true" ]; then
            xcodebuild archive \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath "$ARCHIVE" \
              -destination "generic/platform=iOS" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUM" \
              MARKETING_VERSION="$APP_VER" \
              CODE_SIGN_STYLE=Manual \
              2>&1 | tail -30
          else
            xcodebuild archive \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath "$ARCHIVE" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tail -30
          fi
          echo "✅ Archive: $ARCHIVE"

      # ── Export IPA ────────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          EXPORT="$RUNNER_TEMP/ipa-export"
          mkdir -p "$EXPORT"
          echo "EXPORT_PATH=$EXPORT" >> $GITHUB_ENV

          if [ "${{ inputs.build-type }}" = "release" ] && \
             [ -n "$IOS_TEAM_ID" ] && \
             [ "${IOS_SIGNING_READY:-false}" = "true" ]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0"><dict>
              <key>method</key><string>ad-hoc</string>
              <key>teamID</key><string>${IOS_TEAM_ID}</string>
              <key>compileBitcode</key><false/>
            </dict></plist>
            EOF
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportPath "$EXPORT" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              2>&1 | tail -20
          else
            # Unsigned IPA (zip Payload/)
            APP=$(find "$ARCHIVE_PATH" -name "*.app" | head -1)
            PAYLOAD="$EXPORT/Payload"
            mkdir -p "$PAYLOAD"
            cp -r "$APP" "$PAYLOAD/"
            (cd "$EXPORT" && zip -qr Runner.ipa Payload/)
          fi

      # ── Collect artifacts ─────────────────────────────────────────────────
      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          SHORT_SHA=$(git rev-parse --short HEAD)
          SUFFIX="${VERSION}-${SHORT_SHA}"

          mkdir -p dist-ios

          IPA=$(find "$EXPORT_PATH" -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            DEST="dist-ios/flutter-vpn-go-${SUFFIX}.ipa"
            cp "$IPA" "$DEST"
            echo "ipa=$DEST" >> $GITHUB_OUTPUT
            echo "✅ IPA: $(du -sh $DEST | cut -f1)"
          fi

          ls -lh dist-ios/

      # ── Checksums ─────────────────────────────────────────────────────────
      - name: Generate checksums
        working-directory: dist-ios
        run: shasum -a 256 * > SHA256SUMS-ios.txt && cat SHA256SUMS-ios.txt

      # ── Cleanup keychain ──────────────────────────────────────────────────
      - name: Cleanup signing
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" || true

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload iOS artifacts
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.build-type }}
          path: dist-ios/
          retention-days: 30
          if-no-files-found: warn
