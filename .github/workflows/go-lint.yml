# ─────────────────────────────────────────────────────────────────────────────
# go-lint.yml  — Fast Go static analysis
# Runs on every change to go_client/ to catch issues before full build.
# ─────────────────────────────────────────────────────────────────────────────

name: Go Lint

on:
  push:
    paths:
      - "flutter_vpn_go/go_client/**"
      - ".github/workflows/go-lint.yml"
  pull_request:
    paths:
      - "flutter_vpn_go/go_client/**"

jobs:
  lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: flutter_vpn_go/go_client/go.sum

      - name: Go mod tidy
        working-directory: flutter_vpn_go/go_client
        run: go mod tidy

      - name: Go vet
        working-directory: flutter_vpn_go/go_client
        run: go vet ./...

      - name: staticcheck
        working-directory: flutter_vpn_go/go_client
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./... || true   # non-fatal for now

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: flutter_vpn_go/go_client
          args: >
            --timeout=5m
            --disable=exhaustruct,exhaustive,wrapcheck
          skip-cache: false
        continue-on-error: true   # non-fatal until codebase is fully linted
