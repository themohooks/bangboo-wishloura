# Go static analysis — runs on go_client changes
# Repository root IS the flutter project.

name: Go Lint

on:
  push:
    paths:
      - "go_client/**"
      - ".github/workflows/go-lint.yml"
  pull_request:
    paths:
      - "go_client/**"

jobs:
  lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: go_client/go.sum

      - name: go mod tidy
        working-directory: go_client
        run: go mod tidy

      - name: go vet
        working-directory: go_client
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go_client
          args: >
            --timeout=5m
            --disable=exhaustruct,exhaustive,wrapcheck
        continue-on-error: true
