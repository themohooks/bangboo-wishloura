# Reusable workflow: build Android APK + AAB + Go libclient.so
# The repository root IS the flutter project (pubspec.yaml is at repo root).

name: Build Android

on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        default: "3.22.x"
      go-version:
        type: string
        default: "1.22.x"
      build-type:
        type: string
        default: "release"
      upload-artifacts:
        type: boolean
        default: true
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
    outputs:
      apk-universal:
        value: ${{ jobs.build.outputs.apk-universal }}
      aab:
        value: ${{ jobs.build.outputs.aab }}

jobs:
  build:
    name: Android (${{ inputs.build-type }})
    runs-on: ubuntu-latest

    outputs:
      apk-universal: ${{ steps.collect.outputs.apk-universal }}
      aab:           ${{ steps.collect.outputs.aab }}

    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_API: "26"

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # ── Go ────────────────────────────────────────────────────────────────
      - name: Set up Go ${{ inputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: go_client/go.sum

      # ── Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter ${{ inputs.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: stable
          cache: true

      # ── Android NDK ───────────────────────────────────────────────────────
      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;$NDK_VERSION" \
            "build-tools;34.0.0" \
            "platforms;android-35"

      # ── Go mod tidy ───────────────────────────────────────────────────────
      - name: Go mod tidy
        working-directory: go_client
        run: go mod tidy

      # ── Build libclient.so for each ABI ───────────────────────────────────
      - name: Build Go libclient.so (arm64-v8a)
        working-directory: go_client
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          mkdir -p cmd/android
          cat > cmd/android/main.go << 'EOF'
          package main
          import "github.com/example/flutter_vpn_go/go_client/client"
          func main() { client.Main() }
          EOF

          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          OUT="../android/vpnplugin/src/main/jniLibs/arm64-v8a/libclient.so"
          mkdir -p "$(dirname $OUT)"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CLANG" \
            go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/android
          echo "✅ arm64: $(du -sh $OUT | cut -f1)"

      - name: Build Go libclient.so (armeabi-v7a)
        working-directory: go_client
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi${ANDROID_API}-clang"
          OUT="../android/vpnplugin/src/main/jniLibs/armeabi-v7a/libclient.so"
          mkdir -p "$(dirname $OUT)"
          CGO_ENABLED=1 GOOS=android GOARCH=arm CC="$CLANG" \
            go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/android
          echo "✅ armeabi-v7a: $(du -sh $OUT | cut -f1)"

      - name: Build Go libclient.so (x86_64)
        working-directory: go_client
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${ANDROID_API}-clang"
          OUT="../android/vpnplugin/src/main/jniLibs/x86_64/libclient.so"
          mkdir -p "$(dirname $OUT)"
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$CLANG" \
            go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/android
          echo "✅ x86_64: $(du -sh $OUT | cut -f1)"

      - name: Verify libclient.so files
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="android/vpnplugin/src/main/jniLibs/$abi/libclient.so"
            [ -f "$f" ] || { echo "❌ Missing $f"; exit 1; }
            echo "✅ $abi: $(du -sh $f | cut -f1)"
          done

      # ── Flutter pub get ───────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── Keystore setup ────────────────────────────────────────────────────
      - name: Set up keystore
        if: >
          inputs.build-type == 'release' &&
          secrets.KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          cat > key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF
          echo "✅ Keystore configured"

      # ── Build APK (split per ABI) ─────────────────────────────────────────
      - name: Flutter build APK (split per ABI)
        run: |
          if [ "${{ inputs.build-type }}" = "release" ] && [ -f "android/key.properties" ]; then
            flutter build apk --split-per-abi --release \
              --obfuscate --split-debug-info=build/debug-info
          else
            flutter build apk --split-per-abi --${{ inputs.build-type }}
          fi

      # ── Build APK (universal) ─────────────────────────────────────────────
      - name: Flutter build APK (universal)
        run: |
          if [ "${{ inputs.build-type }}" = "release" ] && [ -f "android/key.properties" ]; then
            flutter build apk --release \
              --obfuscate --split-debug-info=build/debug-info
          else
            flutter build apk --${{ inputs.build-type }}
          fi

      # ── Build AAB ─────────────────────────────────────────────────────────
      - name: Flutter build AAB
        run: |
          if [ "${{ inputs.build-type }}" = "release" ] && [ -f "android/key.properties" ]; then
            flutter build appbundle --release \
              --obfuscate --split-debug-info=build/debug-info
          else
            flutter build appbundle --${{ inputs.build-type }}
          fi

      # ── Collect & rename artifacts ────────────────────────────────────────
      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r\n')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BT="${{ inputs.build-type }}"
          SUFFIX="${VERSION}-${SHORT_SHA}"

          mkdir -p dist

          # APK splits
          for apk in build/app/outputs/flutter-apk/*-${BT}.apk; do
            [ -f "$apk" ] || continue
            ABI=$(basename "$apk" | sed "s/-${BT}.apk//" | sed 's/app-//')
            cp "$apk" "dist/flutter-vpn-go-${SUFFIX}-${ABI}.apk"
          done

          # Universal APK
          UNIV="build/app/outputs/flutter-apk/app-${BT}.apk"
          if [ -f "$UNIV" ]; then
            cp "$UNIV" "dist/flutter-vpn-go-${SUFFIX}-universal.apk"
            echo "apk-universal=dist/flutter-vpn-go-${SUFFIX}-universal.apk" >> $GITHUB_OUTPUT
          fi

          # AAB
          AAB="build/app/outputs/bundle/${BT}/app-${BT}.aab"
          if [ -f "$AAB" ]; then
            cp "$AAB" "dist/flutter-vpn-go-${SUFFIX}.aab"
            echo "aab=dist/flutter-vpn-go-${SUFFIX}.aab" >> $GITHUB_OUTPUT
          fi

          echo "=== dist/ ==="
          ls -lh dist/

      # ── Checksums ─────────────────────────────────────────────────────────
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload Android artifacts
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.build-type }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
