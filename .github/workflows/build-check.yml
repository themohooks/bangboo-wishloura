# ─────────────────────────────────────────────────────────────────────────────
# build-check.yml — CI on every push / PR
# Repository root IS the flutter project.
# ─────────────────────────────────────────────────────────────────────────────

name: Build Check

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip-ios:
        description: "Skip iOS build"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Analyze ────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: dart format check
        run: dart format --set-exit-if-changed lib/

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

  # ── Unit tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: flutter test
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: github.event_name != 'pull_request'
        with:
          directory: coverage/
          flags: flutter
        continue-on-error: true

  # ── Go check ───────────────────────────────────────────────────────────────
  go-check:
    name: Go Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: go_client/go.sum

      - name: go mod tidy check
        working-directory: go_client
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "❌ go.mod or go.sum out of date — run 'go mod tidy'"
            exit 1
          }

      - name: go vet
        working-directory: go_client
        run: go vet ./...

      - name: go build (host syntax check)
        working-directory: go_client
        run: go build ./client/...

  # ── Android debug build ────────────────────────────────────────────────────
  build-android:
    name: Android Debug
    runs-on: ubuntu-latest
    needs: [analyze, go-check]
    env:
      NDK_VERSION: "26.3.11579264"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: go_client/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;$NDK_VERSION" "platforms;android-35"

      - name: Go mod tidy
        working-directory: go_client
        run: go mod tidy

      - name: Build libclient.so (arm64 only — fast CI check)
        working-directory: go_client
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          mkdir -p cmd/android
          cat > cmd/android/main.go << 'EOF'
          package main
          import "github.com/example/flutter_vpn_go/go_client/client"
          func main() { client.Main() }
          EOF

          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          OUT="../android/vpnplugin/src/main/jniLibs/arm64-v8a/libclient.so"
          mkdir -p "$(dirname $OUT)"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CLANG" \
            go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/android
          echo "✅ arm64: $(du -sh $OUT | cut -f1)"

          # Stub other ABIs so Gradle finds all jniLibs
          for ABI in armeabi-v7a x86_64; do
            D="../android/vpnplugin/src/main/jniLibs/$ABI"
            mkdir -p "$D" && cp "$OUT" "$D/libclient.so"
          done

      - name: pub get
        run: flutter pub get

      - name: flutter build apk (debug)
        run: flutter build apk --debug --split-per-abi

      - name: Verify APKs
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "✅ Android build passed"

  # ── iOS build check ────────────────────────────────────────────────────────
  build-ios:
    name: iOS Check
    runs-on: macos-14
    needs: [analyze, go-check]
    if: ${{ github.event.inputs.skip-ios != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: go_client/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Go mod tidy
        working-directory: go_client
        run: go mod tidy

      - name: Build GoClient.xcframework
        working-directory: go_client
        run: |
          mkdir -p ../ios/Frameworks
          gomobile bind -target=ios \
            -o ../ios/Frameworks/GoClient.xcframework ./client
          echo "✅ $(du -sh ../ios/Frameworks/GoClient.xcframework | cut -f1)"

      - name: pub get
        run: flutter pub get

      - name: flutter build ios (no codesign)
        run: flutter build ios --debug --no-codesign

      - name: Verify .app
        run: |
          find build/ios -name "*.app" | head -3
          echo "✅ iOS build check passed"

  # ── Summary ────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [analyze, test, go-check, build-android, build-ios]
    if: always()
    steps:
      - name: Write summary
        run: |
          status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              skipped) echo "⏭️ Skipped" ;;
              *)       echo "❌ Failed" ;;
            esac
          }
          {
            echo "## CI Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Analyze & Format | $(status ${{ needs.analyze.result }}) |"
            echo "| Unit Tests       | $(status ${{ needs.test.result }}) |"
            echo "| Go Check         | $(status ${{ needs.go-check.result }}) |"
            echo "| Android Debug    | $(status ${{ needs.build-android.result }}) |"
            echo "| iOS Check        | $(status ${{ needs.build-ios.result }}) |"
          } >> $GITHUB_STEP_SUMMARY
