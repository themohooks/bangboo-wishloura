# ─────────────────────────────────────────────────────────────────────────────
# build-check.yml
#
# CI workflow: runs on every push to main/develop and on PRs.
# Verifies the project compiles without producing full release artifacts.
#
# Parallel jobs:
#   • analyze      — Flutter analyze + Dart format check
#   • test         — Flutter unit tests
#   • build-android-debug — Quick Android debug build (no signing)
#   • build-ios-check     — iOS build check (macOS, no signing, no IPA)
# ─────────────────────────────────────────────────────────────────────────────

name: Build Check

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
    paths:
      # Only run when relevant files change
      - "flutter_vpn_go/**"
      - ".github/workflows/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "flutter_vpn_go/**"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      skip-ios:
        description: "Skip iOS build check (saves runner minutes)"
        type: boolean
        default: false

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Flutter analyze ──────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: flutter_vpn_go
        run: flutter pub get

      - name: Dart format check
        working-directory: flutter_vpn_go
        run: dart format --set-exit-if-changed lib/

      - name: Flutter analyze
        working-directory: flutter_vpn_go
        run: flutter analyze --no-fatal-infos

  # ── Unit tests ────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: flutter_vpn_go
        run: flutter pub get

      - name: Run tests
        working-directory: flutter_vpn_go
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          directory: flutter_vpn_go/coverage/
          flags: flutter
        continue-on-error: true

  # ── Go vet ────────────────────────────────────────────────────────────────────
  go-check:
    name: Go Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: flutter_vpn_go/go_client/go.sum

      - name: Go mod tidy check
        working-directory: flutter_vpn_go/go_client
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "❌ go.mod/go.sum not up to date. Run 'go mod tidy'."
            exit 1
          fi

      - name: Go vet
        working-directory: flutter_vpn_go/go_client
        run: go vet ./...

      - name: Go build (host platform, for syntax check)
        working-directory: flutter_vpn_go/go_client
        run: |
          # Build for host (not Android/iOS) to check syntax quickly
          # We exclude the main package since it doesn't have a main() at root
          go build ./client/...

  # ── Android debug build ──────────────────────────────────────────────────────
  build-android:
    name: Android Debug
    runs-on: ubuntu-latest
    needs: [analyze, go-check]

    env:
      NDK_VERSION: "26.3.11579264"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: flutter_vpn_go/go_client/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;$NDK_VERSION" \
            "platforms;android-35"

      - name: Go mod tidy
        working-directory: flutter_vpn_go/go_client
        run: go mod tidy

      - name: Build Go libclient.so (arm64 only — fast check)
        working-directory: flutter_vpn_go/go_client
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: |
          mkdir -p cmd/android
          cat > cmd/android/main.go << 'EOF'
          package main
          import "github.com/example/flutter_vpn_go/go_client/client"
          func main() { client.Main() }
          EOF

          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          OUT="../android/vpnplugin/src/main/jniLibs/arm64-v8a/libclient.so"
          mkdir -p "$(dirname $OUT)"

          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CLANG" \
            go build -trimpath -ldflags="-s -w" -o "$OUT" ./cmd/android
          echo "✅ arm64 libclient.so: $(du -sh $OUT | cut -f1)"

          # Create stub files for other ABIs so Gradle doesn't fail
          for ABI in armeabi-v7a x86_64; do
            STUB_DIR="../android/vpnplugin/src/main/jniLibs/$ABI"
            mkdir -p "$STUB_DIR"
            cp "$OUT" "$STUB_DIR/libclient.so"
          done

      - name: Flutter pub get
        working-directory: flutter_vpn_go
        run: flutter pub get

      - name: Flutter build APK (debug)
        working-directory: flutter_vpn_go
        run: flutter build apk --debug --split-per-abi

      - name: Check APK exists
        run: |
          ls -lh flutter_vpn_go/build/app/outputs/flutter-apk/
          echo "✅ APK build succeeded"

  # ── iOS build check ───────────────────────────────────────────────────────────
  build-ios:
    name: iOS Check
    runs-on: macos-14
    needs: [analyze, go-check]
    if: ${{ github.event.inputs.skip-ios != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: flutter_vpn_go/go_client/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Go mod tidy
        working-directory: flutter_vpn_go/go_client
        run: go mod tidy

      - name: Build GoClient.xcframework
        working-directory: flutter_vpn_go/go_client
        run: |
          mkdir -p ../ios/Frameworks
          gomobile bind \
            -target=ios \
            -o ../ios/Frameworks/GoClient.xcframework \
            ./client
          echo "✅ XCFramework: $(du -sh ../ios/Frameworks/GoClient.xcframework | cut -f1)"

      - name: Flutter pub get
        working-directory: flutter_vpn_go
        run: flutter pub get

      - name: Flutter build iOS (no codesign)
        working-directory: flutter_vpn_go
        run: flutter build ios --debug --no-codesign --simulator

      - name: Check .app exists
        run: |
          find flutter_vpn_go/build/ios -name "*.app" | head -5
          echo "✅ iOS build check passed"

  # ── Build matrix summary ──────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [analyze, test, go-check, build-android, build-ios]
    if: always()

    steps:
      - name: Write summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Analyze & Format | ${{ needs.analyze.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests       | ${{ needs.test.result == 'success' && '✅ Passed' || needs.test.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Check         | ${{ needs.go-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Debug    | ${{ needs.build-android.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Check        | ${{ needs.build-ios.result == 'success' && '✅ Passed' || needs.build-ios.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
