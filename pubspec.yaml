name: flutter_vpn_go
description: Cross-platform VPN/proxy app with Flutter UI, Go core, and native VPN layers.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Secure storage (Keychain on iOS, EncryptedSharedPreferences on Android)
  flutter_secure_storage: ^9.0.0

  # Local config persistence
  path_provider: ^2.1.2

  # Unique IDs for log entries and config IDs
  uuid: ^4.3.3

  # Platform diagnostics
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Pigeon — regenerate platform channel bindings when pigeons/vpn_api.dart changes:
  #   dart run pigeon --input pigeons/vpn_api.dart
  pigeon: ^18.0.0

flutter:
  uses-material-design: true
